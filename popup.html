<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Guaraní → Euro</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      padding: 14px;
      color: #1f1f1f;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      margin-top: 12px;
    }
    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 600;
    }
    #save {
      background: #ff5000;
      color: white;
      width: 100%;
      margin-top: 14px;
    }
    #fetchRate {
      background: #eee;
      color: #1f1f1f;
      width: 100%;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 14px;
      color: #444;
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <h1>₲ Guaraní → € Euro</h1>

  <label for="rate">Taux de change (₲ pour 1 €)</label>
  <input type="number" id="rate" min="1" step="1" placeholder="ex : 8000" />

  <button id="fetchRate">🔄 Récupérer le taux actuel</button>

  <div class="switch-row">
    <label for="enabled" style="margin:0;">Activer la conversion</label>
    <input type="checkbox" id="enabled" />
  </div>

  <button id="save">Enregistrer</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
