<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Guaraní → Euro</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      padding: 14px;
      color: #1f1f1f;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #666;
      margin: 0 0 8px;
    }
    section {
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid #e5e5e5;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      margin-top: 10px;
    }
    input[type="number"],
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .field {
      position: relative;
    }
    .field input {
      padding-right: 30px;
    }
    .field .unit {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: #666;
      pointer-events: none;
    }
    .converter-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .converter-row > div {
      flex: 1;
    }
    .arrows {
      font-size: 16px;
      color: #888;
      padding-bottom: 6px;
    }
    .hint {
      font-size: 11px;
      color: #777;
      margin-top: 8px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 600;
    }
    #save {
      background: #ff5000;
      color: white;
      width: 100%;
      margin-top: 14px;
    }
    #fetchRate {
      background: #eee;
      color: #1f1f1f;
      width: 100%;
      margin-top: 8px;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 14px;
      color: #444;
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
    }
    .switch-row label {
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>₲ Guaraní ⇄ € Euro</h1>

  <section>
    <h2>Convertisseur</h2>
    <div class="converter-row">
      <div>
        <label for="gs" style="margin-top:0;">Guaraní</label>
        <div class="field">
          <input type="text" id="gs" inputmode="numeric" placeholder="150.000" autocomplete="off" />
          <span class="unit">₲</span>
        </div>
      </div>
      <div class="arrows">⇄</div>
      <div>
        <label for="eur" style="margin-top:0;">Euro</label>
        <div class="field">
          <input type="text" id="eur" inputmode="decimal" placeholder="18,50" autocomplete="off" />
          <span class="unit">€</span>
        </div>
      </div>
    </div>
    <div class="hint" id="rateHint"></div>
  </section>

  <section style="border-bottom:none; margin-bottom:0; padding-bottom:0;">
    <h2>Réglages</h2>

    <label for="rate" style="margin-top:0;">Taux de change (₲ pour 1 €)</label>
    <input type="number" id="rate" min="1" step="1" placeholder="ex : 8000" />

    <button id="fetchRate">🔄 Récupérer le taux actuel</button>

    <div class="switch-row">
      <label for="enabled">Convertir les prix des pages</label>
      <input type="checkbox" id="enabled" />
    </div>

    <button id="save">Enregistrer</button>

    <div id="status"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
